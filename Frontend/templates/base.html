<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CO2 Monitoring System{% endblock %}</title>
    <!-- include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'measurement_list' %}">CO2 Monitoring</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'measurement_list' %}">Indicators</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Enterprises</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">MQTT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Forecasting</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- main content container -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
